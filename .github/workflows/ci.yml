name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: game_store

    steps:
      - uses: actions/checkout@v4

      - name: Create schema
        run: psql -v ON_ERROR_STOP=1 -q -f sql/01_schema.sql

      - name: Load seed data
        run: psql -v ON_ERROR_STOP=1 -q -f sql/02_seed.sql

      - name: Run all report queries
        run: psql -v ON_ERROR_STOP=1 -q -f sql/03_queries.sql > /dev/null

      - name: Run tests
        run: psql -v ON_ERROR_STOP=1 -q -f tests/run_tests.sql

      - name: Scripts are re-runnable
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/02_seed.sql
          psql -v ON_ERROR_STOP=1 -q -f tests/run_tests.sql
